<div class="photo-of-the-day">
  <div class="heading">Fotos del día</div>
  <div class="description">Algunos de los trabajos más recientes realizados en nuestra peluquería.</div>

  <!-- Loading state -->
  <div *ngIf="isLoading()" class="loading-container">
    <div class="loading-spinner"></div>
    <p>Cargando galería...</p>
  </div>

  <!-- No images state -->
  <div *ngIf="!isLoading() && totalSlides() === 0" class="no-images-container">
    <div class="no-images-icon">📷</div>
    <p>No hay fotos disponibles en este momento</p>
    <small>Las fotos aparecerán aquí cuando sean añadidas desde el panel de administración</small>
  </div>

  <!-- Single image state -->
  <div *ngIf="!isLoading() && totalSlides() === 1" class="single-image-container">
    <div class="single-image-wrapper">
      <!-- width/height reflejan la ratio intrínseca (ej. 1024x1024). priority porque es LCP -->
      <img [ngSrc]="carouselItems()[0].image" [alt]="carouselItems()[0].alt" width="1024" height="1024" priority
        decoding="async" class="single-image">
      <div class="image-caption">
        <span>{{ carouselItems()[0].caption }}</span>
      </div>
    </div>
  </div>

  <!-- Carousel for multiple images -->
  <div *ngIf="!isLoading() && totalSlides() > 1" class="photo-carousel">
    <!-- Contenedor de imágenes -->
    <div class="carousel-container">
      <div class="carousel-track" [style.width]="(totalSlides() * 100) + '%'"
        [style.transform]="'translateX(-' + (currentSlide() * (100 / totalSlides())) + '%)'">
        <div class="carousel-slide" *ngFor="let item of carouselItems(); let i = index"
          [style.width]="(100 / totalSlides()) + '%'">
          <!-- width/height intrínsecos; marcar priority SOLO si es el slide visible -->
          <img [ngSrc]="item.image" [alt]="item.alt" width="1024" height="1024" class="carousel-image"
            [attr.priority]="i === currentSlide() ? '' : null" [attr.loading]="i === currentSlide() ? null : 'lazy'"
            decoding="async">
          <div class="carousel-caption">
            <span>{{ item.caption }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Botones de navegación -->
    <button class="carousel-btn carousel-btn-prev" (click)="prevSlide()" type="button" [disabled]="totalSlides() <= 1">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <button class="carousel-btn carousel-btn-next" (click)="nextSlide()" type="button" [disabled]="totalSlides() <= 1">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18L15 12L9 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <!-- Indicadores -->
    <div class="carousel-indicators">
      <button *ngFor="let item of carouselItems(); let i = index" class="indicator"
        [class.active]="i === currentSlide()" (click)="goToSlide(i)" type="button">
      </button>
    </div>
  </div>
</div>
