<div
  class="root"
  [ngClass]="{
    root_property1Default: property1 === 'Default',
    root_property1Deployed: property1 === 'Deployed',
  }"
  (click)="changeState()"
>
  <div class="container">
    <div class="text" style="font-weight: 700;">{{question}}</div>
    <i class="bi bi-chevron-down" 
      [ngClass]="{
        'rotated': property1 === 'Deployed'}">
    </i>
  </div>
  
  <div class="answer-container" [ngClass]="{'answer-visible': property1 === 'Deployed'}">
    <div class="container answer">
      <div class="text">{{answer}}</div>
    </div>
  </div>
</div>
