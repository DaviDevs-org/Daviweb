<div class="toast-notification" [class.show]="isVisible"
    [ngClass]="['toast-' + config.type, 'toast-' + (config.position || 'top-right')]">

    <div class="toast-icon">
        <i [class]="getIcon()"></i>
    </div>

    <div class="toast-content">
        <div class="toast-title">{{ config.title }}</div>
        <div class="toast-message">{{ config.message }}</div>

        <!-- Botones para confirmaciones -->
        <div *ngIf="config.type === 'confirm'" class="toast-actions">
            <button class="toast-btn toast-btn-secondary" (click)="cancel()">
                {{ config.cancelText || 'Cancelar' }}
            </button>
            <button class="toast-btn toast-btn-primary" (click)="confirm()">
                {{ config.confirmText || 'Confirmar' }}
            </button>
        </div>
    </div>

    <!-- Botón cerrar solo para notificaciones (no para confirmaciones) -->
    <button *ngIf="config.type !== 'confirm'" class="toast-close" (click)="close()">
        <i class="bi bi-x"></i>
    </button>

    <!-- Barra de progreso para auto-cierre -->
    <div *ngIf="config.duration && config.type !== 'confirm'" class="toast-progress"
        [style.animation-duration]="config.duration + 'ms'">
    </div>
</div>
