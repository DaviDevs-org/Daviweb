<section class="content-section">
    <div class="section-header">
        <h2>
            <i class="bi bi-graph-up"></i>
            Estadísticas y Análisis
        </h2>
        <p>Visualiza el rendimiento de tu negocio</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card" *ngFor="let stat of statCards">
            <div class="stat-icon">
                <i [class]="stat.icon"></i>
            </div>
            <div class="stat-content">
                <h3>{{ stat.title }}</h3>
                <div class="stat-number">{{ stat.value }}</div>
                <div class="stat-change" [ngClass]="stat.changeType">{{ stat.change }}</div>
            </div>
        </div>
    </div>

    <!-- Gráfico de ejemplo -->
    <div class="chart-section">
        <h3>Ingresos de los últimos 6 meses</h3>
        <div class="chart-placeholder">
            <p>Aquí iría un gráfico de ingresos</p>
            <small>Implementar con Chart.js o similar</small>
        </div>
    </div>
</section>
