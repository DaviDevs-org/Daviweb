<section class="content-section">
    <div class="section-header">
        <h2>
            <i class="bi bi-info-circle"></i>
            Información General
        </h2>
        <p>Configura la información básica de la peluquería</p>
    </div>

    <div class="info-sections">
        <!-- Horarios -->
        <div class="info-card">
            <h3>
                <i class="bi bi-clock"></i>
                Horarios de Apertura
            </h3>
            <div class="schedule-grid">
                <div class="schedule-row" *ngFor="let day of schedule">
                    <label class="day-label">{{ day.name }}</label>
                    <div class="time-inputs">
                        <input type="time" [(ngModel)]="day.open" class="time-input" [disabled]="day.closed"
                            (blur)="validateTime(day)">
                        <span class="time-separator">-</span>
                        <input type="time" [(ngModel)]="day.close" class="time-input" [disabled]="day.closed"
                            (blur)="validateTime(day)">
                        <label class="closed-checkbox">
                            <input type="checkbox" [(ngModel)]="day.closed">
                            Cerrado
                        </label>
                    </div>
                </div>
            </div>
            <button class="save-btn" (click)="saveSchedule()">
                <i class="bi bi-check-circle"></i>
                Guardar Horarios
            </button>
        </div>

        <!-- Información de contacto -->
        <div class="info-card">
            <h3>
                <i class="bi bi-telephone"></i>
                Información de Contacto
            </h3>
            <div class="contact-form schedule-grid">
                <div class="form-group schedule-row">
                    <label>Teléfono</label>
                    <input type="tel" [(ngModel)]="contactInfo.phone" class="form-input" placeholder="+34 123 456 789">
                </div>
                <div class="form-group schedule-row">
                    <label>Email</label>
                    <input type="email" [(ngModel)]="contactInfo.email" class="form-input"
                        placeholder="info@peluqueriamoderna.com">
                </div>
                <div class="form-group schedule-row">
                    <label>Dirección</label>
                    <textarea [(ngModel)]="contactInfo.address" class="form-textarea"
                        placeholder="Calle Principal, 123..."></textarea>
                </div>
            </div>
            <button class="save-btn" (click)="saveContactInfo()">
                <i class="bi bi-check-circle"></i>
                Guardar Información
            </button>
        </div>
    </div>
</section>
