<section class="content-section">
    <div class="section-header">
        <h2>
            <i class="bi bi-images"></i>
            Gestión de Galería
        </h2>
        <p>Administra las fotos destacadas que aparecen en el carrusel principal</p>
    </div>

    <!-- Subir nueva foto -->
    <div class="upload-section">
        <div class="upload-area" (click)="fileInput.click()">
            <i class="bi bi-cloud-upload"></i>
            <p>Haz clic o arrastra una imagen aquí</p>
            <small>Formatos: JPG, PNG, WebP (máx. 5MB)</small>
            <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" style="display: none;">
        </div>
        <button class="upload-btn" [disabled]="!selectedFile" (click)="uploadImage()">
            <i class="bi bi-upload"></i>
            Subir Imagen
        </button>
    </div>

    <!-- Galería actual -->
    <div class="current-gallery">
        <h3>Fotos Actuales</h3>
        <div class="gallery-grid">
            <div class="gallery-item" *ngFor="let photo of galleryPhotos; let i = index">
                <img [src]="photo.url" [alt]="photo.title">
                <div class="photo-overlay">
                    <div class="photo-info">{{photo.title}}</div>
                    <div class="photo-actions">
                        <button class="action-btn edit-btn" (click)="editPhoto(i)">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="action-btn delete-btn" (click)="deletePhoto(i)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
