<div class="cut">
  <div class="image">
    <img
      [ngSrc]="image"
      [alt]="title"
      width="362"
      height="240"
      priority
      class="cut-image">
  </div>
  <div class="description">
    <div class="heading">{{title}}</div>
    <div class="paragraph">{{description}}</div>
    <button class="reserve-button" type="button">
      <span>Reservar este corte</span>
    </button>
  </div>
</div>
