<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="scissors-icon"><i class="bi bi-scissors"></i></div>
      <h2>PELUQUERÍA MODERNA</h2>
      <p>Acceso al sistema</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-container">
          <input 
            type="email" 
            id="email" 
            name="email"
            [(ngModel)]="loginData.email"
            required
            email
            placeholder="tu@email.com"
            class="form-input"
            [class.error]="loginForm.submitted && !loginData.email"
          >
          <span class="input-icon"><i class="bi bi-person-fill"></i></span>
        </div>
        <div class="error-message" *ngIf="loginForm.submitted && !loginData.email">
          El email es requerido
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-container">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password"
            [(ngModel)]="loginData.password"
            required
            placeholder="Tu contraseña"
            class="form-input"
            [class.error]="loginForm.submitted && !loginData.password"
          >
          <button 
            type="button" 
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-pressed]="showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <i *ngIf="showPassword" class="bi bi-eye-fill" aria-hidden="true"></i>
            <i *ngIf="!showPassword" class="bi bi-eye-slash-fill" aria-hidden="true"></i>
          </button>
        </div>
        <div class="error-message" *ngIf="loginForm.submitted && !loginData.password">
          La contraseña es requerida
        </div>
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="login-btn"
          [disabled]="isLoading"
          [class.loading]="isLoading"
        >
          <span *ngIf="!isLoading">Iniciar Sesión</span>
          <span *ngIf="isLoading" class="loading-spinner">
            <div class="spinner"></div>
            Iniciando...
          </span>
        <button 
          type="button" 
          class="forgot-password-btn"
          (click)="onForgotPassword()"
          aria-label="Recuperar contraseña">
          1Olvidaste tu contrasea?
        </button>
          ¿Olvidaste tu contraseña?
        </button>
      </div>
    </form>

    <div class="login-footer">
      <p>© 2025 Peluquería Moderna. Todos los derechos reservados.</p>
    </div>
  </div>
</div>
