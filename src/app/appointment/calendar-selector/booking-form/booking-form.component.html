<form #bookingForm="ngForm" (ngSubmit)="onSubmit(bookingForm)" novalidate class="booking-form-container">
    <!-- Eliminados los párrafos de debug -->

    <h3 class="form-title">Confirmar Reserva</h3>
    <p class="form-subtitle">Para el {{ date }} a las {{ time }}</p>

    <div class="form-row">
        <div class="form-group">
            <label for="name">Nombre completo *</label>
            <input id="name" name="name" ngModel required minlength="2" placeholder="Tu nombre completo" />
            <div class="error" [class.visible]="nameInvalid">
                Nombre es obligatorio (mínimo 2 caracteres).
            </div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" name="email" ngModel placeholder="ejemplo@email.com" />
            <div class="error" [class.visible]="emailInvalid">
                Introduce un email válido.
            </div>
        </div>

        <div class="form-group">
            <label for="phone">Teléfono</label>
            <input id="phone" type="tel" name="phone" ngModel placeholder="+34 123 456 789" />
            <div class="error" [class.visible]="phoneInvalid">
                Introduce un teléfono válido.
            </div>
        </div>
    </div>

    <div class="error contact-error" [class.visible]="contactEmpty" aria-live="polite">
        Debes rellenar al menos un medio de contacto: email o teléfono.
    </div>

    <div class="form-group">
        <label for="description">Descripción (opcional)</label>
        <textarea id="description" name="description" ngModel rows="4" placeholder="Alguna nota adicional sobre tu reserva..."></textarea>
    </div>

    <div class="form-row">
        <div class="form-group" *ngIf="allowBarberSelection && barbers.length > 0">
            <label for="barber">Peluquero</label>
            <select id="barber" name="barber" ngModel required>
                <option value="Cualquiera">-- Cualquiera --</option>
                <option *ngFor="let b of barbers" [value]="b.name" [disabled]="!b.visible">
                    {{ b.name }}
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="service">Servicio *</label>
            <select name="service" id="service" ngModel required>
                <option value="" disabled selected>-- Selecciona servicio --</option>
                <option *ngFor="let s of services" [value]="s.name">
                    {{s.name}} - {{s.price}}€ ({{this.getTotalTime(s)}} min)
                </option>
            </select>
        </div>
    </div>

    <div class="form-group privacy-consent">
      <label class="checkbox-container">
      <input
        type="checkbox"
        id="privacyConsent"
        name="privacyConsent"
        ngModel
        required
      />
        He leído y acepto la
        <a routerLink="/privacidad" target="_blank">Política de Privacidad</a>
      </label>
      <div class="error" [class.visible]="privacyConsentInvalid" aria-live="polite">
        Debes aceptar la política de privacidad para enviar la reserva.
      </div>
    </div>


  <button type="submit" class="submit-btn" [disabled]="!date || !time || submitting" [attr.aria-label]="'Confirmar reserva en peluquería moderna Alcorcón'">
        <span *ngIf="!submitting">Confirmar Reserva</span>
        <span *ngIf="submitting">Procesando...</span>
    </button>
</form>
