<div class="appointment-section" id="appointments">
  <div class="appointment-header">
    <h2 class="appointment-title">Reserva tu Cita</h2>
    <p class="appointment-description">
      Próximamente podrás reservar tu cita online. Mientras tanto, puedes contactarnos por teléfono o WhatsApp.
    </p>
  </div>

  <div class="appointment-form">
    <div class="form-grid">
      <!-- Columna izquierda -->
      <div class="form-column">
        <div class="form-group">
          <label class="form-label">Nombre completo</label>
          <div class="input-wrapper">
            <i class="bi bi-person input-icon"></i>
            <input type="text" class="form-input" placeholder="Tu nombre completo">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <div class="input-wrapper">
            <i class="bi bi-telephone input-icon"></i>
            <input type="tel" class="form-input" placeholder="Tu número de teléfono">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" class="form-input" placeholder="tu@email.com">
          </div>
        </div>
      </div>

      <!-- Columna derecha -->
      <div class="form-column">
        <div class="form-group">
          <label class="form-label">Fecha deseada</label>
          <div class="input-wrapper">
            <i class="bi bi-calendar3 input-icon"></i>
            <input type="date" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Servicio</label>
          <div class="input-wrapper">
            <i class="bi bi-scissors input-icon"></i>
            <select class="form-select">
              <option value="">Seleccionar servicio</option>
              <option value="corte-clasico">Corte Clásico</option>
              <option value="barba">Arreglo de Barba</option>
              <option value="completo">Corte + Barba</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Comentarios adicionales</label>
          <div class="input-wrapper">
            <i class="bi bi-chat-text input-icon textarea-icon"></i>
            <textarea class="form-textarea" placeholder="Comentarios o peticiones especiales..." rows="3"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="submit-button disabled">
        Enviar solicitud de cita
      </button>
      <p class="form-disclaimer">
        Estamos adaptándonos para ofrecerte la mejor experiencia de reserva online. Mientras tanto, 
        <strong>llámanos o envíanos un WhatsApp al +34 600 000 000</strong>
      </p>
    </div>
  </div>
</div>
