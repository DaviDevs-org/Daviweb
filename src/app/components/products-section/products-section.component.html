<!-- src/app/components/products-section/products-section.component.html -->
<section id="products" class="py-16 bg-gray-50">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="text-3xl font-bold text-center mb-8">Productos en Venta</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      <div *ngFor="let p of products" class="bg-white rounded-lg shadow-lg overflow-hidden">
        <img [src]="p.image" alt="{{ p.name }}" class="w-full h-48 object-cover" />
        <div class="p-6">
          <h3 class="text-xl font-semibold mb-2">{{ p.name }}</h3>
          <p class="text-gray-600 mb-2">{{ p.description }}</p>
          <p class="text-lg font-medium mb-4">{{ p.price }}</p>
          <button class="w-full bg-black text-white px-4 py-2 rounded-md font-medium hover:bg-gray-800 transition">
            Añadir al carrito
          </button>
        </div>
      </div>
    </div>
    <div class="text-center mt-6">
      <p class="mb-4">¿Quieres comprar online?</p>
      <button class="bg-transparent border border-black text-black px-6 py-3 rounded-md font-medium hover:bg-black hover:text-white transition">
        Comprar productos
      </button>
    </div>
    <p class="text-sm text-gray-500 mt-4 text-center">
      Próximamente habilitaremos pago online y citas por internet.
    </p>
  </div>
</section>
