<!-- src/app/components/featured-cuts-section/featured-cuts-section.component.html -->
<section id="featured" class="py-16 bg-gray-50">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="text-3xl font-bold text-center mb-8">Cortes Destacados</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let c of cuts" class="bg-white rounded-lg shadow-lg overflow-hidden">
        <img [src]="c.image" alt="{{ c.title }}" class="w-full h-48 object-cover" />
        <div class="p-6">
          <h3 class="text-xl font-semibold mb-2">{{ c.title }}</h3>
          <p class="text-gray-600 mb-4">{{ c.description }}</p>
          <a href="#booking"
             class="block text-center bg-black text-white px-4 py-2 rounded-md font-medium hover:bg-gray-800 transition">
            Reservar este corte
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
