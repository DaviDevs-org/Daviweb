<!-- src/app/components/faq-section/faq-section.component.html -->
<section id="faq" class="py-16 bg-gray-50">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="text-3xl font-bold text-center mb-8">Preguntas Frecuentes</h2>
    <div class="space-y-4">
      <div *ngFor="let f of faqs; let i = index" class="border rounded-lg overflow-hidden">
        <button (click)="toggle(i)"
                class="w-full flex justify-between items-center px-4 py-3 bg-white">
          <span class="text-lg font-medium">{{ f.question }}</span>
          <svg *ngIf="toggleIndex !== i" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m7-7H5" />
          </svg>
          <svg *ngIf="toggleIndex === i" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 12H5" />
          </svg>
        </button>
        <div *ngIf="toggleIndex === i" class="px-4 py-3 bg-gray-100">
          <p class="text-gray-700">{{ f.answer }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
