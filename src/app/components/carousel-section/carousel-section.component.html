<!-- src/app/components/carousel-section/carousel-section.component.html -->
<section id="carousel" class="py-16 bg-white">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="text-3xl font-bold text-center mb-8">Fotos del Día</h2>
    <div class="relative">
      <img [src]="slides[currentIndex].image" alt="{{ slides[currentIndex].caption }}" class="w-full h-64 object-cover rounded-lg" />
      <p class="absolute bottom-4 left-4 bg-black bg-opacity-50 text-white px-3 py-1 rounded">
        {{ slides[currentIndex].caption }}
      </p>
      <button (click)="prev()"
              class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-50 text-white p-2 rounded-full hover:bg-opacity-75">
        ‹
      </button>
      <button (click)="next()"
              class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-50 text-white p-2 rounded-full hover:bg-opacity-75">
        ›
      </button>
    </div>
    <div class="flex justify-center mt-4 space-x-2">
      <button *ngFor="let s of slides; let i = index"
              (click)="currentIndex = i"
              [class.bg-black]="i === currentIndex"
              class="w-3 h-3 rounded-full bg-gray-300 hover:bg-gray-500 transition"></button>
    </div>
    <button class="mt-6 block mx-auto bg-transparent border border-black text-black px-6 py-3 rounded-md font-medium hover:bg-black hover:text-white transition">
      Ver galería completa
    </button>
  </div>
</section>
