<!-- backdrop -->
<div class="modal-backdrop" *ngIf="visible" (click)="close()" aria-hidden="true"></div>

<!-- modal -->
<div class="modal" *ngIf="visible" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <header class="modal-header">
        <h2>{{ title }}</h2>
        <button class="close-icon" (click)="close()" aria-label="Cerrar">✕</button>
    </header>

    <div class="modal-body">
        <div class="modal-scroll" [innerHTML]="sanitizedContent"></div>
    </div>

    <footer class="modal-footer">
        <button class="btn-close" (click)="close()">Cerrar</button>
    </footer>
</div>
